spring.application.name=basic-shirt-app

# Perfil local em memoria (H2) para rodar e testar sem precisar do PostgreSQL instalado
spring.datasource.url=jdbc:h2:mem:loja_roupas;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
