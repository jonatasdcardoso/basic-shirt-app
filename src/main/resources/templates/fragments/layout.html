<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<!-- Arquivo so de fragmentos: pedacos de HTML reaproveitados em todas as paginas
     usando th:replace="~{fragments/layout :: nome}" -->

<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' | Basic Shirt'">Basic Shirt</title>
    <link th:href="@{/css/estilo.css}" rel="stylesheet" type="text/css">
</head>

<body>

<header th:fragment="cabecalho" class="cabecalho">
    <a class="pular-conteudo" href="#conteudo">Pular para o conteúdo</a>

    <!-- Faixa preta fininha no topo, estilo loja de insider -->
    <p class="faixa-topo">Camisetas básicas 100% algodão</p>

    <div class="cabecalho-interno">
        <a class="logo" th:href="@{/catalogo}">BASIC SHIRT</a>
        <nav aria-label="Menu principal">
            <ul class="menu">
                <li><a th:href="@{/catalogo}">Catálogo</a></li>
                <li><a th:href="@{/carrinho}">Carrinho</a></li>
                <li><a th:href="@{/login}">Entrar</a></li>
            </ul>
        </nav>
    </div>
</header>

<footer th:fragment="rodape" class="rodape">
    <p class="logo-rodape">BASIC SHIRT</p>
    <p>Trabalho de Programação para a Web</p>
</footer>

</body>
</html>
